spring.application.name=url-shortener

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/url_shortener}
spring.datasource.username=${DB_USERNAME:url_shortener}
spring.datasource.password=${DB_PASSWORD:url_shortener}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
# Flyway
spring.flyway.enabled=true

# Server
server.port=${PORT:8080}

# Logging

logging.level.com.mahdi.url_shortener=DEBUG
spring.output.ansi.enabled=ALWAYS

# Checking Health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Info 
management.info.env.enabled=true

info.app.name=URL Shortener
info.app.description=REST API for creating and managing shortened URLs
info.app.version=1.0.0
# Public URL used in create-link responses (no trailing slash required)
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}

# Comma-separated frontend origins allowed to call the API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
